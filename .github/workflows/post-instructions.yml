name: Comment PR Procedures

on:
  pull_request:
    branches: [master]
    types: [opened]

jobs:
  post_comment_master:
    # Fork PRs get a read-only token and cannot use the merge options.
    if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-slim
    steps:
      - name: Create master comment
        if: ${{github.base_ref == 'master'}}
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 #v4.0.0
        with:
          issue-number: ${{github.event.number}}
          body: |
            Hello @${{github.actor}},

            Choose what happens when this pull request is merged into `master`:

            - [ ] merge in production
            - [x] delete branch

            - **merge in production**: cherry-picks this branch's commits to the `production` branch after the merge. If the cherry-pick fails, a comment is added here and you need to cherry-pick manually.
            - **delete branch**: deletes this branch after the pull request is closed, whether or not it is merged.

            > **Note:** Only the checkboxes in this comment control these options, and only users with write access can change them. Do not delete the branch manually with the button at the bottom of the page.

            Cheers

